<!DOCTYPE html>
<html lang="{{t:common:html.lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{t:meta.title}}</title>
    <meta name="description" content="{{t:meta.description}}">
    <meta property="og:title" content="{{t:meta.title}}">
    <meta property="og:description" content="{{t:meta.description}}">
    {{> head}}
    <link rel="stylesheet" href="{{root}}css/contact.css">
    {{! 標記 JS 可用：.reveal 只在有 JS 時才預先隱藏，避免 JS 失效時內容永久看不見 }}
    <script>document.documentElement.classList.add('js');</script>
</head>
<body>
    {{> header}}

    <main id="main">
        <div class="container">
            <div class="page-header">
                <h1 class="page-header__title">{{t:common:nav.contact}}</h1>
                <p class="page-header__lead">{{t:feel-free-to-reach}}</p>
            </div>

            <ul class="contact-list">
                <li>
                    <a class="card card--link contact-card" href="mailto:redwu.cs15@nycu.edu.tw">
                        <img class="contact-card__icon" src="{{root}}resource/icon-mail.webp" alt="" width="40" height="40">
                        <span class="contact-card__text">
                            <span class="contact-card__name">Email</span>
                            <span class="contact-card__handle">redwu.cs15@nycu.edu.tw</span>
                        </span>
                    </a>
                </li>
                <li>
                    <a class="card card--link contact-card" href="https://www.linkedin.com/in/hung-ruei-wu-021a90323" target="_blank" rel="noopener">
                        <img class="contact-card__icon" src="{{root}}resource/icon-linkedin.webp" alt="" width="40" height="40">
                        <span class="contact-card__text">
                            <span class="contact-card__name">LinkedIn</span>
                            <span class="contact-card__handle">Hung-Ruei Wu</span>
                        </span>
                    </a>
                </li>
                <li>
                    <a class="card card--link contact-card" href="https://www.instagram.com/x85432/" target="_blank" rel="noopener">
                        <img class="contact-card__icon" src="{{root}}resource/icon-instagram.webp" alt="" width="40" height="40">
                        <span class="contact-card__text">
                            <span class="contact-card__name">Instagram</span>
                            <span class="contact-card__handle">@x85432</span>
                        </span>
                    </a>
                </li>
                <li>
                    <a class="card card--link contact-card" href="https://www.facebook.com/profile.php?viewas=100000686899395&id=100013736884142" target="_blank" rel="noopener">
                        <img class="contact-card__icon" src="{{root}}resource/icon-facebook.webp" alt="" width="40" height="40">
                        <span class="contact-card__text">
                            <span class="contact-card__name">Facebook</span>
                            <span class="contact-card__handle">{{t:common:site.name}}</span>
                        </span>
                    </a>
                </li>
                <li>
                    <a class="card card--link contact-card" href="https://line.me/ti/p/JHONyck_tl" target="_blank" rel="noopener">
                        <img class="contact-card__icon" src="{{root}}resource/icon-line.webp" alt="" width="40" height="40">
                        <span class="contact-card__text">
                            <span class="contact-card__name">Line</span>
                            <span class="contact-card__handle">{{t:add-me-on-line}}</span>
                        </span>
                    </a>
                </li>
            </ul>
        </div>
    </main>

    {{> footer}}

    <script src="{{root}}script/site.js"></script>
</body>
</html>
