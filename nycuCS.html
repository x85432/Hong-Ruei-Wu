        <div class="container">
            <div class="card-grid dept-grid">
                <div class="card">
                    <h3 class="card__title" data-i18n="nycuCS.card.history.title">歷史沿革</h3>
                    <p class="card__body" data-i18n="nycuCS.card.history.body">陽明交大資訊工程學系成立於1970年，經歷多次改革與技術進步，是台灣頂尖的資工系之一。</p>
                </div>

                <div class="card">
                    <h3 class="card__title" data-i18n="nycuCS.card.faculty.title">人員組成</h3>
                    <p class="card__body" data-i18n="nycuCS.card.faculty.body">系上擁有50多位教授與研究員，致力於各領域的研究與教學，提供學生優質學習環境。</p>
                </div>

                <div class="card">
                    <h3 class="card__title" data-i18n="nycuCS.card.research.title">研究領域</h3>
                    <p class="card__body" data-i18n="nycuCS.card.research.body">涵蓋人工智慧、數據科學、嵌入式系統等多個前沿研究領域，持續引領技術創新。</p>
                </div>

                <div class="card">
                    <h3 class="card__title" data-i18n="nycuCS.card.awards.title">傑出成就</h3>
                    <p class="card__body" data-i18n="nycuCS.card.awards.body">多名校友在國際科技公司擔任要職，並在國際學術領域上取得重大突破與貢獻。</p>
                </div>
